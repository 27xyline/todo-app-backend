[project]
name = "petproject"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.135.2",
    "psycopg[binary]==3.3.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.0",
    "sqlalchemy[asyncio]==2.0.49",
    "uvicorn==0.42.0",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest",
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Под какую версию Python проверять синтаксис и правила
target-version = "py314"
# Максимальная длина строки
line-length = 88
exclude = ["alembic"]

[tool.ruff.lint]
# Какие группы правил включены: E - pycodestyle, F - pyflakes, I - сортировка импортов
select = ["E", "F", "I"]

[tool.ruff.format]
# Использовать двойные кавычки
quote-style = "double"
# Использовать пробелы вместо табов
indent-style = "space"
# Оставлять "магические" висячие запятые для удобного переноса строк
skip-magic-trailing-comma = false
# Автоматически выбрать стиль перевода строк под среду/файл
line-ending = "auto"

[tool.mypy]
# Какие каталоги проверять по умолчанию
files = ["app"]
# Под какую версию Python проверять типы
python_version = "3.14"
# Проверять даже тела функций без полной типизации
check_untyped_defs = true
# Показывать коды ошибок рядом с сообщениями
show_error_codes = true
# Предупреждать о лишних type: ignore
warn_unused_ignores = true
# Не падать на внешних библиотеках без type stubs
ignore_missing_imports = true
